name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Validate the manifest
        run: python -m json.tool MultiBots.json > /dev/null

      - name: Run Python tests
        run: python -m unittest discover --start-directory tests --pattern "test_*.py"

      - name: Run Lua specifications
        shell: bash
        run: |
          set -euo pipefail
          for spec in tests/*_spec.lua; do
            echo "::group::$spec"
            lua5.1 "$spec"
            echo "::endgroup::"
          done
