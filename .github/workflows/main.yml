name: Approve passing pull requests

on:
  workflow_run:
    workflows:
      - PR CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    name: Auto Approve
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Approve the tested commit
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const pullRequest = run.pull_requests?.[0];

            if (!pullRequest) {
              core.notice('The successful CI run is not associated with a pull request.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = pullRequest.number;
            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber, per_page: 100 },
            );
            if (changedFiles.some((file) => file.filename.startsWith('.github/'))) {
              core.setFailed('Workflow and GitHub configuration changes require two human approvals.');
              return;
            }

            const current = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            if (current.data.state !== 'open' || current.data.draft) {
              core.notice('The pull request is closed or still a draft.');
              return;
            }
            if (current.data.base.ref !== 'main') {
              core.notice('The pull request no longer targets main.');
              return;
            }
            if (current.data.head.sha !== run.head_sha) {
              core.setFailed('CI passed for an outdated commit; refusing to approve it.');
              return;
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: pullNumber, per_page: 100 },
            );
            const alreadyApproved = reviews.some((review) =>
              review.user?.login === 'github-actions[bot]' &&
              review.state === 'APPROVED' &&
              review.commit_id === run.head_sha
            );
            if (alreadyApproved) {
              core.notice('github-actions[bot] already approved this commit.');
              return;
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pullNumber,
              commit_id: run.head_sha,
              event: 'APPROVE',
              body: [
                'Automated review passed.',
                '',
                '- MultiBots.json is valid JSON',
                '- Python unit tests passed',
                '- Lua 5.1 specifications passed',
                '',
                `Reviewed commit \`${run.head_sha.slice(0, 12)}\`.`,
              ].join('\n'),
            });
